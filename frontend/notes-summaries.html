<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notebook | Spartan Scholars</title>

  <link rel="icon" type="image/png" href="assets/ChatGPT Image Mar 2, 2026, 03_47_01 PM-Photoroom.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <button id="notesSidebarToggle" class="iconBtn" type="button" aria-label="Toggle sidebar">&#9776;</button>
      <a class="brand brand--link" href="/" aria-label="Go to Spartan Scholars home">
        <div class="brand__icon">
          <img class="brand__logo brand__logo--light" src="assets/ChatGPT Image Mar 2, 2026, 02_52_17 PM-Photoroom.png" alt="Spartan Scholars logo" />
          <img class="brand__logo brand__logo--dark" src="assets/ChatGPT Image Mar 2, 2026, 02_54_16 PM-Photoroom.png" alt="Spartan Scholars logo" />
        </div>
        <div class="brand__name">
          <img class="brand__wordmark brand__wordmark--light" src="assets/ChatGPT Image Mar 2, 2026, 02_52_21 PM-Photoroom.png" alt="Spartan Scholars" />
          <img class="brand__wordmark brand__wordmark--dark" src="assets/ChatGPT Image Mar 2, 2026, 03_06_15 PM-Photoroom.png" alt="Spartan Scholars" />
        </div>
      </a>
    </div>

    <div class="topbar__right">
      <button class="iconBtn" type="button" data-theme-toggle aria-label="Switch to dark mode">&#9789;</button>
      <button class="logoutBtn" type="button" data-logout>Logout</button>
      <button class="profileBtn" type="button">
        <span class="profileBtn__icon">P</span>
        <span class="profileBtn__text">Profile</span>
      </button>
    </div>
  </header>

  <div class="shell shell--assistant">
    <aside class="sidebar">
      <a class="askAiBtn" href="/ai-assistant">
        <span class="askAiBtn__spark">*</span>
        Ask AI
      </a>

      <hr class="sidebar__divider" />

      <nav class="nav">
        <a class="nav__item nav__item--active" href="/notes" aria-current="page">My Notes</a>
        <a class="nav__item" href="/study-groups">Study Groups</a>
        <a class="nav__item" href="/take-quizzes">Take Quizzes</a>
        <a class="nav__item" href="/explore-topics">Explore Topics</a>
        <a class="nav__item" href="/discussion-board">Discussion Board</a>
        <a class="nav__item" href="/analytics">View Analytics</a>
      </nav>
    </aside>

    <main class="main main--notes">
      <section class="notesHeader">
        <div class="notesHeader__title">
          <div class="notesHeader__icon notesHeader__icon--image">
            <img src="assets/ChatGPT Image Mar 2, 2026, 03_47_01 PM-Photoroom.png" alt="Spartan Notebook logo" class="notesHeader__logo notesHeader__logo--light" />
            <img src="assets/ChatGPT Image Mar 2, 2026, 03_54_54 PM-Photoroom.png" alt="Spartan Notebook logo" class="notesHeader__logo notesHeader__logo--dark" />
          </div>
          <div>
            <h1>Notebook</h1>
            <p><span id="notesCount">0</span> notes saved</p>
          </div>
        </div>
        <button type="button" class="notesHeader__button" id="newNoteBtn">+ New Note</button>
      </section>

      <section class="notesGrid" id="notesGrid"></section>
    </main>
  </div>

  <div class="modal fade" id="noteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="noteModalTitle">New Note</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="noteForm">
          <div class="modal-body">
            <input type="hidden" id="noteId" />

            <div class="mb-3">
              <label class="form-label" for="noteTitle">Title</label>
              <input class="form-control" id="noteTitle" type="text" maxlength="150" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="noteCategory">Category</label>
              <input class="form-control" id="noteCategory" type="text" maxlength="100" placeholder="Example: Biology 101" />
            </div>

            <div class="mb-3">
              <label class="form-label" for="noteContent">Type Notes</label>
              <textarea class="form-control" id="noteContent" rows="8" placeholder="Write notes here..."></textarea>
            </div>

            <div class="mb-2">
              <label class="form-label" for="noteFile">Upload PDF / Word</label>
              <input class="form-control" id="noteFile" type="file" accept=".pdf,.doc,.docx" />
            </div>

            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="removeAttachment" />
              <label class="form-check-label" for="removeAttachment">
                Remove existing attachment
              </label>
            </div>

            <div class="small text-muted" id="noteAttachmentInfo"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Note</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const notesShell = document.querySelector(".shell");
    document.getElementById("notesSidebarToggle").addEventListener("click", () => {
      notesShell.classList.toggle("shell--collapsed");
    });
  </script>
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
