spring.application.name=spartan-scholars-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spartan_scholars}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:spartan-scholars-dev-secret-key-2026-keep-this-local}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.admin.password=${ADMIN_PASSWORD:UNCG2026SpartanScholars}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB