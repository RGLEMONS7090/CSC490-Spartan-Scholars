<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discussion Board | Spartan Scholars</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <button id="discussionSidebarToggle" class="iconBtn" type="button" aria-label="Toggle sidebar">&#9776;</button>
      <a class="brand brand--link" href="/" aria-label="Go to Spartan Scholars home">
        <div class="brand__icon">
          <img class="brand__logo brand__logo--light" src="assets/ChatGPT Image Mar 2, 2026, 02_52_17 PM-Photoroom.png" alt="Spartan Scholars logo" />
          <img class="brand__logo brand__logo--dark" src="assets/ChatGPT Image Mar 2, 2026, 02_54_16 PM-Photoroom.png" alt="Spartan Scholars logo" />
        </div>
        <div class="brand__name">
          <img class="brand__wordmark brand__wordmark--light" src="assets/ChatGPT Image Mar 2, 2026, 02_52_21 PM-Photoroom.png" alt="Spartan Scholars" />
          <img class="brand__wordmark brand__wordmark--dark" src="assets/ChatGPT Image Mar 2, 2026, 03_06_15 PM-Photoroom.png" alt="Spartan Scholars" />
        </div>
      </a>
    </div>

    <div class="topbar__right">
      <button class="iconBtn" type="button" data-theme-toggle aria-label="Switch to dark mode">&#9789;</button>
      <button class="logoutBtn" type="button" data-logout>Logout</button>
      <button class="profileBtn" type="button">
        <span class="profileBtn__icon">P</span>
        <span class="profileBtn__text">Profile</span>
      </button>
    </div>
  </header>

  <div class="shell shell--assistant">
    <aside class="sidebar">
      <a class="askAiBtn" href="/ai-assistant">
        <span class="askAiBtn__spark">*</span>
        Ask AI
      </a>

      <hr class="sidebar__divider" />

      <nav class="nav">
        <a class="nav__item" href="/notes">My Notes</a>
        <a class="nav__item" href="/study-groups">Study Groups</a>
        <a class="nav__item" href="/take-quizzes">Take Quizzes</a>
        <a class="nav__item" href="/explore-topics">Explore Topics</a>
        <a class="nav__item nav__item--active" href="/discussion-board" aria-current="page">Discussion Board</a>
        <a class="nav__item" href="/analytics">View Analytics</a>
      </nav>
    </aside>

    <main class="main main--discussion">
      <section class="discussionTop">
        <div>
          <div class="discussionTitle">
            <div class="discussionTitle__icon">D</div>
            <h1>Discussion Board</h1>
          </div>
          <p class="discussionTop__subtitle">Ask questions and share knowledge with the community</p>
        </div>

        <a href="/discussion-board/new" class="discussionTop__button discussionTop__button--link">+ New Discussion</a>
      </section>

      <section class="discussionFilters">
        <button type="button" class="discussionFilters__chip discussionFilters__chip--active" data-sort="all">All Discussions</button>
        <button type="button" class="discussionFilters__chip" data-sort="trending">Trending</button>
        <button type="button" class="discussionFilters__chip" data-sort="recent">Recent</button>
      </section>

      <section class="discussionList" id="discussionList">
        <article class="discussionCard">
          <h2>Loading discussions...</h2>
          <p class="discussionCard__text">Fetching current posts.</p>
        </article>
      </section>
    </main>
  </div>

  <script>
    const discussionShell = document.querySelector(".shell");
    document.getElementById("discussionSidebarToggle").addEventListener("click", () => {
      discussionShell.classList.toggle("shell--collapsed");
    });
  </script>
  <script src="theme.js"></script>
  <script src="/js/discussion-board.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
