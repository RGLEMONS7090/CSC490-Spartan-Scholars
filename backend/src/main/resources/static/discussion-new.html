<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Discussion | Spartan Scholars</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <a class="brand brand--link" href="/" aria-label="Go to Spartan Scholars home">
        <div class="brand__icon">
          <img class="brand__logo brand__logo--light" src="/assets/ChatGPT Image Mar 2, 2026, 02_52_17 PM-Photoroom.png" alt="Spartan Scholars logo" />
          <img class="brand__logo brand__logo--dark" src="/assets/ChatGPT Image Mar 2, 2026, 02_54_16 PM-Photoroom.png" alt="Spartan Scholars logo" />
        </div>
        <div class="brand__name">
          <img class="brand__wordmark brand__wordmark--light" src="/assets/ChatGPT Image Mar 2, 2026, 02_52_21 PM-Photoroom.png" alt="Spartan Scholars" />
          <img class="brand__wordmark brand__wordmark--dark" src="/assets/ChatGPT Image Mar 2, 2026, 03_06_15 PM-Photoroom.png" alt="Spartan Scholars" />
        </div>
      </a>
    </div>
    <div class="topbar__right">
      <button class="iconBtn" type="button" data-theme-toggle aria-label="Switch to dark mode">&#9789;</button>
      <button class="logoutBtn" type="button" data-logout>Logout</button>
    </div>
  </header>

  <main class="main main--discussion">
    <section class="discussionTop">
      <div>
        <div class="discussionTitle">
          <div class="discussionTitle__icon">+</div>
          <h1>New Discussion</h1>
        </div>
        <p class="discussionTop__subtitle">Create a title and description, then publish to the board.</p>
      </div>
      <a href="/discussion-board" class="discussionTop__button discussionTop__button--link">Back to Board</a>
    </section>

    <article class="discussionCard">
      <form id="newDiscussionForm" class="d-grid gap-3">
        <div>
          <label for="discussionTitle" class="form-label">Title</label>
          <input id="discussionTitle" name="title" type="text" class="form-control" maxlength="200" required />
        </div>
        <div>
          <label for="discussionDescription" class="form-label">Description</label>
          <textarea id="discussionDescription" name="description" class="form-control" rows="8" required></textarea>
        </div>
        <div class="d-flex justify-content-end">
          <button type="submit" class="discussionTop__button">Done</button>
        </div>
      </form>
    </article>
  </main>

  <script src="/theme.js"></script>
  <script src="/js/discussion-new.js"></script>
</body>
</html>
