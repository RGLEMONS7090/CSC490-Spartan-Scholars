<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Spartan Scholars</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="authPage">
  <main class="authPage__layout">
    <section class="authHero">
      <div class="authHero__panel">
        <a class="brand brand--link authHero__brand" href="/" aria-label="Go to Spartan Scholars home">
          <div class="brand__icon">
            <img class="brand__logo brand__logo--light" src="/assets/ChatGPT Image Mar 2, 2026, 02_52_17 PM-Photoroom.png" alt="Spartan Scholars logo" />
            <img class="brand__logo brand__logo--dark" src="/assets/ChatGPT Image Mar 2, 2026, 02_54_16 PM-Photoroom.png" alt="Spartan Scholars logo" />
          </div>
          <div class="brand__name">
            <img class="brand__wordmark brand__wordmark--light" src="/assets/ChatGPT Image Mar 2, 2026, 02_52_21 PM-Photoroom.png" alt="Spartan Scholars" />
            <img class="brand__wordmark brand__wordmark--dark" src="/assets/ChatGPT Image Mar 2, 2026, 03_06_15 PM-Photoroom.png" alt="Spartan Scholars" />
          </div>
        </a>
        <button class="iconBtn authThemeToggle" type="button" data-theme-toggle aria-label="Switch to dark mode">&#9789;</button>
        <p class="authHero__eyebrow">Academic community platform</p>
        <h1 class="authHero__title">Welcome back to your study space.</h1>
        <p class="authHero__copy">Sign in to continue to notes, discussions, quizzes, and study groups without losing your place.</p>
      </div>
    </section>

    <section class="authCardWrap">
      <div class="authCard card shadow">
        <h2 class="text-center mb-2">Login</h2>
        <p class="authCard__subtitle text-center mb-4">Use your Spartan Scholars account to continue.</p>
        <div id="loginError" class="authMessage authMessage--error" hidden role="alert" aria-live="polite"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" required />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" required />
          </div>

          <button type="submit" class="btn btn-primary w-100">Login</button>

          <p class="text-center mt-3 mb-0">
            Don't have an account?
            <a href="/signup">Sign up</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <script src="/theme.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
